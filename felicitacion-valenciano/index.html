<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Felicitación Dra. Valenciano Canet</title>
<style>
@font-face{font-family:"Trueno";src:url("TruenoRg.otf");font-weight:400}
@font-face{font-family:"Trueno";src:url("TruenoSBd.otf");font-weight:600}
@font-face{font-family:"Trueno";src:url("TruenoBd.otf");font-weight:700}
@font-face{font-family:"Trueno";src:url("TruenoExBd.otf");font-weight:800}
@font-face{font-family:"Trueno";src:url("TruenoBlk.otf");font-weight:900}
body{margin:0}
.pieza{width:1080px;height:1350px;position:relative;overflow:hidden;background:#005da4;font-family:"Trueno",Arial,sans-serif;color:#fff}
.cabecera{position:absolute;left:0;top:0;width:1080px;height:146px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 64px;box-sizing:border-box}
.ids{display:flex;align-items:center;gap:40px}
.foto{position:absolute;left:500px;top:146px;width:580px;height:1204px;overflow:hidden}
.foto img{position:absolute;width:1264px;height:1680px;left:-372px;top:-360px}
.col{position:absolute;left:0;top:146px;width:500px;height:1204px;box-sizing:border-box;padding:84px 52px 70px 60px;display:flex;flex-direction:column}
.etq{font-size:23px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0}
.nombre{font-size:60px;font-weight:900;line-height:1.02;letter-spacing:-.01em;margin:26px 0 0}
.regla{width:72px;height:8px;background:#f99d1c;margin:40px 0 34px}
.grado{font-size:38px;font-weight:600;line-height:1.18;margin:0}
.u{font-size:26px;font-weight:400;margin:14px 0 0}
.fin{margin-top:auto}
.fel{font-size:62px;font-weight:900;line-height:1;letter-spacing:-.01em;margin:0}
.sub{font-size:34px;font-weight:600;margin:10px 0 0;color:#fff}
.costura{position:absolute;left:500px;top:146px;width:12px;height:1204px;background:#f99d1c}
.barra{width:56px;height:8px;background:#f99d1c;margin:0 0 22px}
</style>
</head>
<body>
<div class="pieza" data-document-role="page" data-label="Felicitación Dra. Valenciano Canet">
  <header class="cabecera">
    <img src="firma-promocional-negro.svg" alt="Universidad de Costa Rica" style="height:82px">
    <div class="ids">
      <img src="facultad-educacion-horizontal.svg" alt="Facultad de Educación" style="height:52px">
      <img src="eoee-horizontal.svg" alt="Escuela de Orientación y Educación Especial" style="height:64px">
    </div>
  </header>
  <div class="foto"><img src="foto-ana.png" alt=""></div>
  <div class="costura" aria-hidden="true"></div>
  <div class="col">
    <p class="etq">La EOEE felicita a la</p>
    <p class="nombre">Dra. Ana Grettel Valenciano Canet</p>
    <div class="regla"></div>
    <p class="grado">Doctorado en Ciencias Sociales</p>
    <p class="u">Universidad Nacional</p>
    <div class="fin">
      <div class="barra"></div>
      <p class="fel">¡Felicidades!</p>
      <p class="sub">en su graduación</p>
    </div>
  </div>
</div>
</body>
</html>
